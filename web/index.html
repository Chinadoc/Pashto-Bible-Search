<!DOCTYPE html>
<html lang="ps">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pashto Bible Search</title>
    <style>
      :root { --bg: #0b1220; --fg: #e6edf5; --muted: #9fb3c8; --accent: #0ea5e9; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji'; background: var(--bg); color: var(--fg); }
      header { position: sticky; top: 0; z-index: 10; background: rgba(11,18,32,0.9); backdrop-filter: blur(8px); box-shadow: 0 2px 14px rgba(0,0,0,.35); padding: 14px 16px; }
      .container { max-width: 960px; margin: 0 auto; padding: 16px; }
      .row { display: flex; gap: 10px; align-items: center; }
      #search { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #1f2a44; background: #0e1627; color: var(--fg); font-size: 1rem; }
      #search:disabled { opacity: 0.7; }
      select, button { padding: 10px 12px; border-radius: 10px; border: 1px solid #1f2a44; background: #0e1627; color: var(--fg); }
      .tabs { display: flex; gap: 10px; margin-top: 10px; }
      .tabs button { background: #0e1627; border: 1px solid #1f2a44; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
      .tabs button.active { background: var(--accent); color: #06121f; border-color: var(--accent); }
      #results { margin-top: 16px; display: grid; gap: 12px; contain: content; }
      .result { background: #0e1627; border: 1px solid #1f2a44; border-radius: 10px; padding: 12px; content-visibility: auto; contain: content; will-change: transform; }
      .ref { color: var(--muted); margin-bottom: 6px; font-size: 0.95rem; }
      .text { line-height: 1.7; font-size: 1.05rem; }
      mark { background: #ffe54d; color: #111; padding: 0 3px; border-radius: 4px; }
      .meta { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
      #stats { color: var(--muted); font-size: 0.9rem; margin: 8px 0 4px; }
      #coverage { position: sticky; top: 64px; z-index: 9; padding: 8px 0; backdrop-filter: blur(6px); }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip { border: 1px solid #1f2a44; background: #0e1627; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
      .chip.active { background: var(--accent); color: #06121f; border-color: var(--accent); }
      .more { background: transparent; color: var(--muted); border: 1px dashed #1f2a44; cursor: pointer; padding: 8px 12px; border-radius: 8px; }
      .related-forms-panel { margin-bottom: 16px; }
      .related-forms-list { margin-top: 8px; }
      .related-form { padding: 6px 12px; border: 1px solid #1f2a44; border-radius: 6px; margin-bottom: 4px; cursor: pointer; display: inline-block; margin-right: 8px; }
      .related-form:hover { background: #0f1a2e; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 8px 10px; border-bottom: 1px solid #1f2a44; text-align: left; }
      tbody tr:hover { background: #0f1a2e; }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="row">
          <input id="search" type="text" placeholder="...لوډ کېږي" aria-label="Search" dir="auto" />
          <select id="scope" aria-label="Scope">
            <option value="nt">NT</option>
            <option value="ot">OT</option>
            <option value="all">All</option>
          </select>
          <button id="go" aria-label="Search">Search</button>
        </div>
        <div class="tabs" id="tabs">
          <button data-tab="search" class="active">Search</button>
          <button data-tab="lexicon">Lexicon</button>
        </div>
      </div>
    </header>
    <main class="container">
      <div id="coverage"></div>
      <div id="stats" class="stats" aria-live="polite"></div>
      <div id="results"></div>
      <div id="lexicon" style="display:none;"></div>
    </main>
    <script src="./script.js"></script>
  </body>
  </html>
