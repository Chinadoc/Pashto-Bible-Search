name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN is missing" >&2; exit 1; fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then echo "SUPABASE_PROJECT_REF is missing" >&2; exit 1; fi

      - name: Supabase login (token)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase --version

      - name: Set function secret (service role)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "SUPABASE_SERVICE_ROLE_KEY is missing" >&2; exit 1; fi
          # Functions do not allow secrets starting with SUPABASE_. Use SERVICE_KEY instead.
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            SERVICE_KEY="$SUPABASE_SERVICE_ROLE_KEY"

      - name: Deploy pashto-processor
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy pashto-processor \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --debug
