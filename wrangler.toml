# Cloudflare Worker Configuration for Pashto Bible Search
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "pashtobiblesearch"
main = "cloudflare/worker-api.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Worker settings
workers_dev = true
route = ""
# Uncomment and set your zone_id and route for production
# zone_id = "your-zone-id"
# route = "pashtobiblesearch.workers.dev/*"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "pashto-bible-db"
database_id = "your-d1-database-id"  # Replace with actual D1 database ID
# To create: wrangler d1 create pashto-bible-db
# Then update database_id with the returned ID

# R2 Bucket binding for audio files
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "pashto-bible-audio"
# To create: wrangler r2 bucket create pashto-bible-audio

# Environment variables (if needed)
[vars]
# Add any public environment variables here

# Development settings
[env.development]
name = "pashtobiblesearch-dev"
workers_dev = true

[[env.development.d1_databases]]
binding = "DB"
database_name = "pashto-bible-db-dev"
database_id = "your-dev-d1-database-id"

[[env.development.r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "pashto-bible-audio-dev"

# Production settings
[env.production]
name = "pashtobiblesearch"
workers_dev = false

[[env.production.d1_databases]]
binding = "DB"
database_name = "pashto-bible-db"
database_id = "your-prod-d1-database-id"

[[env.production.r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "pashto-bible-audio"

# Build configuration
[build]
command = ""
# If you need to build TypeScript, add build command here

# Observability
[observability]
enabled = true
