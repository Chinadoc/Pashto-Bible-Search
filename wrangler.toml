name = "pashtobiblesearch"
main = "cloudflare/worker-api.ts"
compatibility_date = "2024-10-27"
account_id = "3ac1a6fafce90adf6b1c8f1280dfc94d"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "pashto-bible-db"
database_id = "54a972b6-897a-4ae0-ba19-ecf4a6edc3b0"

# R2 Bucket binding
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "pashto-bible-audio"

# Environment variables (non-sensitive)
[vars]
ENVIRONMENT = "production"

# Secrets (set via wrangler secret put ELEVENLABS_API_KEY)
# ELEVENLABS_API_KEY - set this via: npx wrangler secret put ELEVENLABS_API_KEY

# This is your workers.dev subdomain
# After deployment, your worker will be available at:
# https://pashtobiblesearch.YOUR_SUBDOMAIN.workers.dev
# You can find YOUR_SUBDOMAIN in the Cloudflare dashboard

